---
mcpo_user: "mcpo"
mcpo_group: "mcpo"
mcpo_version: "latest"
mcpo_host: "127.0.0.1"
mcpo_port: 8000
mcpo_install_dir: "/opt/mcpo"
# Each Python MCP server (and mcpo itself) gets its own venv so their
# dependency trees (notably `mcp`) can't conflict with each other.
mcpo_venvs_dir: "{{ mcpo_install_dir }}/venvs"
mcpo_venv_dir: "{{ mcpo_venvs_dir }}/mcpo"
mcpo_unifi_venv_dir: "{{ mcpo_venvs_dir }}/unifi"
mcpo_proxmox_venv_dir: "{{ mcpo_venvs_dir }}/proxmox"
mcpo_email_venv_dir: "{{ mcpo_venvs_dir }}/email"
mcpo_aws_venv_dir: "{{ mcpo_venvs_dir }}/aws"
mcpo_config_dir: "/etc/mcpo"
mcpo_config_file: "{{ mcpo_config_dir }}/config.json"
mcpo_env_file: "{{ mcpo_config_dir }}/mcpo.env"

# Internal Bearer token for Open WebUI -> mcpo authentication
# Written to mcpo_env_file as MCPO_API_KEY (not passed on the command line).
# Constraints (systemd EnvironmentFile parsing): single line, no leading/trailing
# whitespace, and no quotes or backslashes. Stored in secrets.yml (vault).
mcpo_api_key: ""

# UniFi Network MCP configuration (unifi-network-mcp via Python virtualenv)
mcpo_enable_unifi: true
mcpo_unifi_version: "latest"
mcpo_unifi_host: "10.0.1.1"
mcpo_unifi_port: 443
mcpo_unifi_site: "default"
mcpo_unifi_username: "agent-homelab-sre"
mcpo_unifi_password: ""
mcpo_unifi_insecure: true

# Proxmox VE MCP configuration (mcp-proxmox via Python virtualenv)
mcpo_enable_proxmox: true
mcpo_proxmox_version: "latest"
mcpo_proxmox_host: "pve01"
mcpo_proxmox_port: 8006
mcpo_proxmox_user: "user@pve"
mcpo_proxmox_token_name: "mcp"
mcpo_proxmox_token_value: ""
mcpo_proxmox_verify_ssl: true

# Email (IMAP/SMTP) MCP configuration (mcp-email via Python virtualenv)
mcpo_enable_email: false
mcpo_email_version: "latest"
mcpo_email_imap_host: "imaps.brwyatt.net"
mcpo_email_imap_port: 993
mcpo_email_smtp_host: "smtps.brwyatt.net"
mcpo_email_smtp_port: 465
mcpo_email_username: ""
mcpo_email_password: ""
mcpo_email_allowed_recipient_domains: "brwyatt.net"

# AWS MCP configuration (mcp-proxy-for-aws via Python virtualenv)
mcpo_enable_aws: false
mcpo_aws_version: "latest"
mcpo_aws_endpoint: "https://aws-mcp.us-east-1.api.aws/mcp"
mcpo_aws_region: "us-west-2"
mcpo_aws_access_key_id: ""
mcpo_aws_secret_access_key: ""
mcpo_aws_read_only: false

# Home Assistant MCP configuration (Streamable HTTP)
mcpo_enable_homeassistant: false
mcpo_homeassistant_url: "https://homeassistant.home.brwyatt.net/api/mcp"
mcpo_homeassistant_token: ""

# Extra Environment variables for mcpo
mcpo_extra_env: {}

# Standard configuration templates for MCP servers (UniFi and Proxmox)
mcpo_unifi_config:
  command: "{{ mcpo_unifi_venv_dir }}/bin/mcp-server-unifi-network"
  env:
    UNIFI_HOST: "{{ mcpo_unifi_host }}"
    UNIFI_USERNAME: "{{ mcpo_unifi_username }}"
    UNIFI_PASSWORD: "{{ mcpo_unifi_password }}"
    UNIFI_PORT: "{{ mcpo_unifi_port | default('443') | string }}"
    UNIFI_SITE: "{{ mcpo_unifi_site | default('default') }}"
    UNIFI_VERIFY_SSL: "{{ 'false' if mcpo_unifi_insecure else 'true' }}"

mcpo_proxmox_config:
  command: "{{ mcpo_proxmox_venv_dir }}/bin/mcp-proxmox"
  env:
    PROXMOX_HOST: "{{ mcpo_proxmox_host }}"
    PROXMOX_PORT: "{{ mcpo_proxmox_port | string }}"
    PROXMOX_TOKEN_ID: "{{ mcpo_proxmox_user }}!{{ mcpo_proxmox_token_name }}"
    PROXMOX_TOKEN_SECRET: "{{ mcpo_proxmox_token_value }}"
    PROXMOX_VERIFY_SSL: "{{ 'true' if mcpo_proxmox_verify_ssl else 'false' }}"

mcpo_email_config:
  command: "{{ mcpo_email_venv_dir }}/bin/mcp-email"
  disabledTools:
    - "email_configure"
    - "email_test_connection"
  env:
    IMAP_HOST: "{{ mcpo_email_imap_host }}"
    IMAP_PORT: "{{ mcpo_email_imap_port | string }}"
    IMAP_USER: "{{ mcpo_email_username }}"
    IMAP_PASS: "{{ mcpo_email_password }}"
    IMAP_USE_SSL: "true"
    SMTP_HOST: "{{ mcpo_email_smtp_host }}"
    SMTP_PORT: "{{ mcpo_email_smtp_port | string }}"
    SMTP_USER: "{{ mcpo_email_username }}"
    SMTP_PASS: "{{ mcpo_email_password }}"
    SMTP_USE_SSL: "true"
    EMAIL_ALLOWED_RECIPIENT_DOMAINS: "{{ mcpo_email_allowed_recipient_domains }}"

mcpo_aws_config:
  command: "{{ mcpo_aws_venv_dir }}/bin/mcp-proxy-for-aws"
  args: "{{ [mcpo_aws_endpoint, '--metadata', 'AWS_REGION=' + mcpo_aws_region] + (['--read-only'] if mcpo_aws_read_only else []) }}"
  env:
    AWS_REGION: "{{ mcpo_aws_region }}"
    AWS_DEFAULT_REGION: "{{ mcpo_aws_region }}"
    AWS_ACCESS_KEY_ID: "{{ mcpo_aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ mcpo_aws_secret_access_key }}"

mcpo_homeassistant_config:
  type: "streamable-http"
  url: "{{ mcpo_homeassistant_url }}"
  headers:
    Authorization: "Bearer {{ mcpo_homeassistant_token }}"

# Python-based MCP servers installed via pip, one venv each (only if enabled)
mcpo_python_servers:
  - package: unifi-network-mcp
    version: "{{ mcpo_unifi_version }}"
    venv: "{{ mcpo_unifi_venv_dir }}"
    enabled: "{{ mcpo_enable_unifi }}"
  - package: mcp-proxmox
    version: "{{ mcpo_proxmox_version }}"
    venv: "{{ mcpo_proxmox_venv_dir }}"
    enabled: "{{ mcpo_enable_proxmox }}"
  - package: mcp-email
    version: "{{ mcpo_email_version }}"
    venv: "{{ mcpo_email_venv_dir }}"
    enabled: "{{ mcpo_enable_email }}"
  - package: mcp-proxy-for-aws
    version: "{{ mcpo_aws_version }}"
    venv: "{{ mcpo_aws_venv_dir }}"
    enabled: "{{ mcpo_enable_aws }}"

# The active servers dictionary (can be overriden or appended in group_vars)
mcpo_servers: >-
  {%- set servers = {} -%}
  {%- if mcpo_enable_unifi -%}
    {%- set _ = servers.update({'unifi': mcpo_unifi_config}) -%}
  {%- endif -%}
  {%- if mcpo_enable_proxmox -%}
    {%- set _ = servers.update({'proxmox': mcpo_proxmox_config}) -%}
  {%- endif -%}
  {%- if mcpo_enable_email -%}
    {%- set _ = servers.update({'email': mcpo_email_config}) -%}
  {%- endif -%}
  {%- if mcpo_enable_aws -%}
    {%- set _ = servers.update({'aws': mcpo_aws_config}) -%}
  {%- endif -%}
  {%- if mcpo_enable_homeassistant -%}
    {%- set _ = servers.update({'homeassistant': mcpo_homeassistant_config}) -%}
  {%- endif -%}
  {{ servers }}
