---
- name: Check for mcpo user
  ansible.builtin.getent:
    database: passwd
    key: "{{ mcpo_user }}"
    fail_key: false
- name: Create local mcpo user
  ansible.builtin.user:
    name: "{{ mcpo_user }}"
    home: "{{ mcpo_install_dir }}"
    shell: /bin/false
    system: true
  when: ansible_facts.getent_passwd[mcpo_user] is none
- name: Install system package dependencies
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present
- name: Create mcpo directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ mcpo_user }}"
    group: "{{ mcpo_group }}"
    mode: '0750'
  loop:
    - "{{ mcpo_install_dir }}"
    - "{{ mcpo_config_dir }}"
- name: Create mcpo virtualenvs directory
  ansible.builtin.file:
    path: "{{ mcpo_venvs_dir }}"
    state: directory
    owner: "{{ mcpo_user }}"
    group: "{{ mcpo_group }}"
    mode: '0750'
- name: Install mcpo via pip in its own venv
  ansible.builtin.pip:
    name: "{{ 'mcpo' if mcpo_version == 'latest' else 'mcpo==' + mcpo_version }}"
    state: latest
    virtualenv: "{{ mcpo_venv_dir }}"
    virtualenv_command: "/usr/bin/python3 -m venv"
  notify: Restart mcpo
- name: Install enabled MCP servers via pip, one venv per server
  ansible.builtin.pip:
    name: "{{ item.package if item.version == 'latest' else item.package + '==' + item.version }}"
    state: latest
    virtualenv: "{{ item.venv }}"
    virtualenv_command: "/usr/bin/python3 -m venv"
  loop: "{{ mcpo_python_servers }}"
  loop_control:
    label: "{{ item.package }}"
  when: item.enabled | bool
  notify: Restart mcpo
- name: Ensure mcpo directory ownership
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ mcpo_user }}"
    group: "{{ mcpo_group }}"
    recurse: true
  loop:
    - "{{ mcpo_install_dir }}"
    - "{{ mcpo_config_dir }}"
- name: Deploy mcpo configuration
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ mcpo_config_file }}"
    owner: "{{ mcpo_user }}"
    group: "{{ mcpo_group }}"
    mode: '0600'
  notify: Restart mcpo
- name: Deploy mcpo environment file
  ansible.builtin.template:
    src: mcpo.env.j2
    dest: "{{ mcpo_env_file }}"
    owner: "{{ mcpo_user }}"
    group: "{{ mcpo_group }}"
    mode: '0600'
  no_log: true
  notify: Restart mcpo
- name: Create mcpo systemd unit
  ansible.builtin.template:
    src: mcpo.service.j2
    dest: /etc/systemd/system/mcpo.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart mcpo
- name: Ensure mcpo is started and enabled
  ansible.builtin.service:
    name: mcpo
    state: started
    enabled: true
# The unit is Type=simple, so systemd (and the service module) report success as
# soon as the process is forked, even if it crashes immediately afterwards.
# Apply any pending restarts now, then verify mcpo actually came up.
- name: Apply pending mcpo handlers before health check
  ansible.builtin.meta: flush_handlers
- name: Wait for mcpo to listen
  ansible.builtin.wait_for:
    host: "{{ '127.0.0.1' if mcpo_host in ['0.0.0.0', ''] else mcpo_host }}"
    port: "{{ mcpo_port }}"
    state: started
    delay: 2
    timeout: 60
  when: not ansible_check_mode
- name: Check mcpo unit state
  ansible.builtin.systemd:
    name: mcpo
  register: mcpo_unit_state
  changed_when: false
  when: not ansible_check_mode
- name: Assert mcpo is active
  ansible.builtin.assert:
    that:
      - mcpo_unit_state.status.ActiveState == 'active'
    fail_msg: >-
      mcpo.service is {{ mcpo_unit_state.status.ActiveState }}/{{ mcpo_unit_state.status.SubState }}
      after start. Check 'journalctl -u mcpo'.
    quiet: true
  when: not ansible_check_mode
