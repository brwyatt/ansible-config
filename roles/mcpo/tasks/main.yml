---
- name: Check for mcpo user
  ansible.builtin.getent:
    database: passwd
    key: "{{ mcpo_user }}"
    fail_key: false
- name: Create local mcpo user
  ansible.builtin.user:
    name: "{{ mcpo_user }}"
    home: "{{ mcpo_install_dir }}"
    shell: /bin/false
    system: true
  when: ansible_facts.getent_passwd[mcpo_user] is none
- name: Install system package dependencies
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present
- name: Create mcpo directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ mcpo_user }}"
    group: "{{ mcpo_group }}"
    mode: '0750'
  loop:
    - "{{ mcpo_install_dir }}"
    - "{{ mcpo_config_dir }}"
- name: Define MCP packages specification
  ansible.builtin.set_fact:
    mcpo_pip_packages_spec:
      - name: "mcpo"
        version: "{{ mcpo_version | default('latest') }}"
      - name: "mcp-proxmox"
        version: "{{ mcpo_proxmox_version | default('latest') }}"
      - name: "unifi-network-mcp"
        version: "{{ mcpo_unifi_version | default('latest') }}"
      - name: "mcp-email"
        version: "{{ mcpo_email_version | default('latest') }}"
      - name: "mcp-proxy-for-aws"
        version: "{{ mcpo_aws_version | default('latest') }}"

- name: Fetch latest MCP package versions from PyPI
  ansible.builtin.uri:
    url: "https://pypi.org/pypi/{{ item.name }}/json"
    return_content: true
  loop: "{{ mcpo_pip_packages_spec }}"
  loop_control:
    label: "{{ item.name }}"
  register: mcpo_pypi_releases
  when: item.version == 'latest'
  check_mode: false

- name: Build resolved MCP pip packages list
  ansible.builtin.set_fact:
    mcpo_pip_packages_resolved: >-
      {%- set resolved = [] -%}
      {%- for r in mcpo_pypi_releases.results -%}
        {%- if r.skipped | default(false) -%}
          {%- set _ = resolved.append(r.item.name ~ '==' ~ r.item.version) -%}
        {%- else -%}
          {%- set _ = resolved.append(r.item.name ~ '==' ~ r.json.info.version) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ resolved }}

- name: Install mcpo and python MCP servers via pip in venv
  ansible.builtin.pip:
    name: "{{ mcpo_pip_packages_resolved }}"
    state: present
    virtualenv: "{{ mcpo_venv_dir }}"
    virtualenv_command: "/usr/bin/python3 -m venv"
  notify: Restart mcpo
- name: Ensure mcpo directory ownership
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ mcpo_user }}"
    group: "{{ mcpo_group }}"
    recurse: true
  loop:
    - "{{ mcpo_install_dir }}"
    - "{{ mcpo_config_dir }}"
- name: Deploy mcpo configuration
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ mcpo_config_file }}"
    owner: "{{ mcpo_user }}"
    group: "{{ mcpo_group }}"
    mode: '0600'
  notify: Restart mcpo
- name: Create mcpo systemd unit
  ansible.builtin.template:
    src: mcpo.service.j2
    dest: /etc/systemd/system/mcpo.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart mcpo
- name: Ensure mcpo is started and enabled
  ansible.builtin.service:
    name: mcpo
    state: started
    enabled: true
