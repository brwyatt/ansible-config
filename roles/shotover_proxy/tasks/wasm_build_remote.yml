---
- name: Install build dependencies on remote host
  ansible.builtin.package:
    name:
      - cargo
      - rustc
    state: present
  become: true
- name: Add WASM target to remote rustc
  ansible.builtin.command:
    cmd: "rustup target add {{ shotover_wasm_target }}"
  register: rustup_target_add
  changed_when: "'info: downloading' in rustup_target_add.stderr or 'info: installing' in rustup_target_add.stderr"
  failed_when: false
- name: Create remote temp build directory
  ansible.builtin.tempfile:
    state: directory
    suffix: shotover-wasm-build
  register: temp_build_dir
- name: Copy source code to remote build directory
  ansible.builtin.copy:
    src: "{{ role_path }}/files/redis_prefix_rewrite_wasm/"
    dest: "{{ temp_build_dir.path }}/"
    owner: "{{ shotover_user }}"
    group: "{{ shotover_group }}"
    mode: '0755'
- name: Build WASM module remotely
  ansible.builtin.command:
    cmd: "cargo build --target {{ shotover_wasm_target }} --release"
  args:
    chdir: "{{ temp_build_dir.path }}"
  register: remote_build_output
  changed_when: true
- name: Copy built WASM to final versioned location
  ansible.builtin.copy:
    src: "{{ temp_build_dir.path }}/target/{{ shotover_wasm_target }}/release/redis_prefix_rewrite_wasm.wasm"
    dest: "/opt/shotover/wasm_transforms/{{ wasm_src_hash }}/redis_prefix_rewrite_wasm.wasm"
    owner: "{{ shotover_user }}"
    group: "{{ shotover_group }}"
    mode: '0644'
    remote_src: true
- name: Clean up remote temp build directory
  ansible.builtin.file:
    path: "{{ temp_build_dir.path }}"
    state: absent
