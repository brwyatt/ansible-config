---
- name: Stop and disable temporary code-server systemd service
  ansible.builtin.systemd:
    name: code-server
    state: stopped
    enabled: false
  become: true
  failed_when: false
- name: Remove temporary code-server systemd service file
  ansible.builtin.file:
    path: /etc/systemd/system/code-server.service
    state: absent
  become: true
  notify: Reload systemd
- name: Stop and disable old code-tunnel service
  ansible.builtin.systemd:
    name: code-tunnel
    state: stopped
    enabled: false
  become: true
  failed_when: false
- name: Remove old code-tunnel systemd service file
  ansible.builtin.file:
    path: /etc/systemd/system/code-tunnel.service
    state: absent
  become: true
  notify: Reload systemd
- name: Remove temporary VS Code apt repository config
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/vscode.sources
    state: absent
  become: true
- name: Remove temporary Microsoft GPG keyring
  ansible.builtin.file:
    path: /usr/share/keyrings/microsoft.gpg
    state: absent
  become: true
- name: Flush handlers to reload systemd
  ansible.builtin.meta: flush_handlers
- name: Download Coder code-server deb package
  ansible.builtin.get_url:
    url: "https://github.com/coder/code-server/releases/download/v{{ code_server_version }}/code-server_{{ code_server_version }}_amd64.deb"
    dest: "/tmp/code-server_{{ code_server_version }}_amd64.deb"
    mode: '0644'
  become: true
- name: Install Coder code-server deb package
  ansible.builtin.apt:
    deb: "/tmp/code-server_{{ code_server_version }}_amd64.deb"
  become: true
- name: Ensure user code-server config directory exists
  ansible.builtin.file:
    path: "/home/home.brwyatt.net/{{ code_server_user }}/.config/code-server"
    state: directory
    owner: "{{ code_server_user }}"
    group: "{{ code_server_group }}"
    mode: '0750'
  become: true
- name: Configure Coder code-server config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "/home/home.brwyatt.net/{{ code_server_user }}/.config/code-server/config.yaml"
    owner: "{{ code_server_user }}"
    group: "{{ code_server_group }}"
    mode: '0640'
  become: true
  notify: Restart code-server
- name: Flush handlers to start code-server
  ansible.builtin.meta: flush_handlers
- name: Ensure code-server service is enabled and running
  ansible.builtin.service:
    name: "code-server@{{ code_server_user }}"
    state: started
    enabled: true
  become: true
