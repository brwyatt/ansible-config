---
- name: Download Coder code-server deb package
  ansible.builtin.get_url:
    url: "https://github.com/coder/code-server/releases/download/v{{ code_server_version }}/code-server_{{ code_server_version }}_amd64.deb"
    dest: "/tmp/code-server_{{ code_server_version }}_amd64.deb"
    mode: '0644'
  become: true
- name: Install Coder code-server deb package
  ansible.builtin.apt:
    deb: "/tmp/code-server_{{ code_server_version }}_amd64.deb"
  become: true
- name: Ensure Coder code-server systemd override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/code-server@.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
- name: Configure Coder code-server systemd override for Microsoft Marketplace
  ansible.builtin.copy:
    content: |
      [Service]
      Environment=EXTENSIONS_GALLERY='{"serviceUrl":"https://marketplace.visualstudio.com/_apis/public/gallery","itemUrl":"https://marketplace.visualstudio.com/items"}'
    dest: /etc/systemd/system/code-server@.service.d/override.conf
    owner: root
    group: root
    mode: '0644'
  become: true
  notify:
    - Reload systemd
    - Restart code-server
- name: Ensure user code-server config directory exists
  ansible.builtin.file:
    path: "/home/home.brwyatt.net/{{ code_server_user }}/.config/code-server"
    state: directory
    owner: "{{ code_server_user }}"
    group: "{{ code_server_group }}"
    mode: '0750'
  become: true
- name: Configure Coder code-server config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "/home/home.brwyatt.net/{{ code_server_user }}/.config/code-server/config.yaml"
    owner: "{{ code_server_user }}"
    group: "{{ code_server_group }}"
    mode: '0640'
  become: true
  notify: Restart code-server
- name: Flush handlers to start code-server
  ansible.builtin.meta: flush_handlers
- name: Ensure code-server service is enabled and running
  ansible.builtin.service:
    name: "code-server@{{ code_server_user }}"
    state: started
    enabled: true
  become: true
