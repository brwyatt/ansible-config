---
- name: Retrieve user passwd details
  ansible.builtin.getent:
    database: passwd
    key: "{{ code_server_user }}"
  become: true
- name: Set code_server_user_home fact
  ansible.builtin.set_fact:
    code_server_user_home: "{{ ansible_facts.getent_passwd[code_server_user][4] }}"
- name: Fetch latest code-server release version from GitHub
  ansible.builtin.uri:
    url: "https://api.github.com/repos/coder/code-server/releases/latest"
    return_content: true
  register: code_server_github_release
  when: code_server_version | default('latest') == 'latest'
  check_mode: no
- name: Set code_server_actual_version fact from GitHub
  ansible.builtin.set_fact:
    code_server_actual_version: "{{ code_server_github_release.json.tag_name | regex_replace('^v', '') }}"
  when: code_server_version | default('latest') == 'latest'
- name: Set code_server_actual_version fact from explicit version
  ansible.builtin.set_fact:
    code_server_actual_version: "{{ code_server_version }}"
  when: code_server_version | default('latest') != 'latest'
- name: Download Coder code-server deb package
  ansible.builtin.get_url:
    url: >-
      https://github.com/coder/code-server/releases/download/v{{
      code_server_actual_version }}/code-server_{{
      code_server_actual_version }}_amd64.deb
    dest: "/tmp/code-server_{{ code_server_actual_version }}_amd64.deb"
    mode: '0644'
  become: true
- name: Install Coder code-server deb package
  ansible.builtin.apt:
    deb: "/tmp/code-server_{{ code_server_actual_version }}_amd64.deb"
  become: true
  notify: Restart code-server
- name: Ensure Coder code-server systemd override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/code-server@.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
- name: Configure Coder code-server systemd override for Microsoft Marketplace
  ansible.builtin.copy:
    content: |
      [Service]
      Environment=EXTENSIONS_GALLERY='{"serviceUrl":"https://marketplace.visualstudio.com/_apis/public/gallery","itemUrl":"https://marketplace.visualstudio.com/items"}'
    dest: /etc/systemd/system/code-server@.service.d/override.conf
    owner: root
    group: root
    mode: '0644'
  become: true
  notify:
    - Reload systemd
    - Restart code-server
- name: Ensure user code-server config directory exists
  ansible.builtin.file:
    path: "{{ code_server_user_home }}/.config/code-server"
    state: directory
    owner: "{{ code_server_user }}"
    group: "{{ code_server_group }}"
    mode: '0750'
  become: true
- name: Configure Coder code-server config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ code_server_user_home }}/.config/code-server/config.yaml"
    owner: "{{ code_server_user }}"
    group: "{{ code_server_group }}"
    mode: '0640'
  become: true
  notify: Restart code-server
- name: Ensure user code-server User settings directory exists
  ansible.builtin.file:
    path: "{{ code_server_user_home }}/.local/share/code-server/User"
    state: directory
    owner: "{{ code_server_user }}"
    group: "{{ code_server_group }}"
    mode: '0700'
  become: true
- name: Check if settings.json exists
  ansible.builtin.stat:
    path: "{{ code_server_user_home }}/.local/share/code-server/User/settings.json"
  register: settings_json_stat
  become: true
- name: Slurp settings.json contents
  ansible.builtin.slurp:
    src: "{{ code_server_user_home }}/.local/share/code-server/User/settings.json"
  register: settings_json_slurp
  when: settings_json_stat.stat.exists
  become: true
- name: Parse existing settings.json or default to empty dict
  ansible.builtin.set_fact:
    existing_settings: >-
      {{ (settings_json_slurp.content | b64decode | from_json)
      if (settings_json_stat.stat.exists and settings_json_slurp.content is defined)
      else {} }}
- name: Merge remote.extensionKind setting
  ansible.builtin.set_fact:
    updated_settings: "{{ existing_settings | combine({'remote.extensionKind': {'*': ['workspace']}}, recursive=true) }}"
- name: Ensure settings.json is configured with remote.extensionKind
  ansible.builtin.copy:
    dest: "{{ code_server_user_home }}/.local/share/code-server/User/settings.json"
    content: "{{ updated_settings | to_nice_json }}\n"
    owner: "{{ code_server_user }}"
    group: "{{ code_server_group }}"
    mode: '0640'
  become: true
  notify: Restart code-server
- name: Flush handlers to start code-server
  ansible.builtin.meta: flush_handlers
- name: Ensure code-server service is enabled and running
  ansible.builtin.service:
    name: "code-server@{{ code_server_user }}"
    state: started
    enabled: true
  become: true
