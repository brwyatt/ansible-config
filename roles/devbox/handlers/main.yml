---
- name: Apt update
  ansible.builtin.apt:
    update_cache: true
  become: true
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
- name: Restart code-server
  ansible.builtin.systemd:
    name: code-server
    state: restarted
    daemon_reload: true
  become: true
