---
certbot_certs:
  - - "{{ inventory_hostname }}"
    - "{{ inventory_hostname | replace('server.', '') }}"
    - "home.brwyatt.net"
    - "portal.server.home.brwyatt.net"
    - "portal.home.brwyatt.net"

proxy_port: 8080
reverseproxy_nginx_after:
  - network-online.target
  - portal.service

reverseproxy_configs:
  - destination: "http://127.0.0.1:{{ proxy_port }}"
    server_names:
      - "{{ inventory_hostname }}"
      - "{{ inventory_hostname | replace('server.', '') }}"
      - "home.brwyatt.net"
      - "portal.server.home.brwyatt.net"
      - "portal.home.brwyatt.net"
    sso_enabled: true
    public_paths:
      - "/static/"
      - "/theme.css"
      - "/healthz"
      - "/readyz"
    healthcheck:
      path: /healthz
      checks:
        - type: port
          value: "{{ proxy_port }}"
        - type: service
          value: portal

reverseproxy_recursive_proxies: true
reverseproxy_trusted_proxies:
  # Inbound Proxy Hosts
  - "172.17.30.111"
  - "172.17.30.197"
