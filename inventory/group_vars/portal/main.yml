---
certbot_certs:
  - - "portal.home.brwyatt.net"
    - "home.brwyatt.net"

proxy_port: 8080
proxy_sso_enabled: true
proxy_sso_optional: true
proxy_healthcheck:
  path: /healthz
  checks:
    - type: port
      value: "{{ proxy_port }}"
    - type: service
      value: portal
proxy_public_paths:
  - "/static/"
  - "/theme.css"
  - "/readyz"
  - "/favicon.ico"

reverseproxy_nginx_after:
  - network-online.target
  - portal.service

reverseproxy_recursive_proxies: true
reverseproxy_trusted_proxies:
  # Inbound Proxy Hosts
  - "172.17.30.111"
  - "172.17.30.197"
  # Inbound Proxy VIP
  - "172.17.30.201"
  # Load Balancer Hosts
  - "172.17.30.120"
  - "172.17.30.124"
  # Load Balancer VIP
  - "172.17.30.212"

portal_ui_title: "BRNET-Home"
portal_ui_subtitle: "HomeLab Services Portal"
portal_ui_footer_text: "HomeLab Portal"
portal_network_trusted_proxies:
  - "127.0.0.1/32"
  - "::1/128"
  # Inbound Proxy Hosts
  - "172.17.30.197/32"
  - "172.17.30.111/32"
  # Inbound Proxy VIP
  - "172.17.30.201/32"
  # Load Balancer Hosts
  - "172.17.30.120/32"
  - "172.17.30.124/32"
  # Load Balancer VIP
  - "172.17.30.212/32"
portal_network_classes:
  external:
    name: "External"
    icon: "globe"
  internal:
    name: "Local"
    icon: "house"
  vpn:
    name: "VPN"
    icon: "shield"
  remote_site:
    name: "Remote Site"
    icon: "network"
portal_subnets:
  - cidr: "172.17.10.0/24"
    name: "User VLAN"
    network_class: "internal"
  - cidr: "172.16.10.0/24"
    name: "User VPN"
    network_class: "vpn"
  - cidr: "172.18.10.0/24"
    name: "ChickenCoop User"
    network_class: "remote_site"
portal_categories:
  - id: "auth"
    name: "Authentication Services"
    icon: "key"
    services:
      - name: "Authelia"
        url: "https://auth.home.brwyatt.net/"
        description: "Single sign-on and identity provider portal"
        icon: "shield"
        healthcheck:
          path: "/api/health"
          interval: 15
          json_query: '$.status = "OK"'
      - name: "FreeIPA"
        url: "https://ipa.home.brwyatt.net/"
        description: "LDAP account management"
        icon: "key"
        network_classes:
          - "internal"
          - "vpn"
        requires_groups:
          - "admins"

  - id: "comms"
    name: "Communications Services"
    icon: "phone"
    services:
      - name: "The Lounge"
        url: "https://thelounge.home.brwyatt.net/"
        description: "IRC Web Client"
        icon: "globe"
        requires_groups:
          - "thelounge-users"
        healthcheck:
          path: "/health"
          interval: 15
          json_query: '$.*.status and $count(*[status="OK"]) = $count(*)'

  - id: "infra"
    name: "Infrastructure Services"
    icon: "server"
    services:
      - name: "Proxmox"
        url: "https://proxmox.home.brwyatt.net/"
        description: "Proxmox virtualization cluster"
        icon: "server"
        network_classes:
          - "internal"
          - "vpn"
        requires_groups:
          - "pve-admins"
          - "pve-users"
        healthcheck:
          interval: 15
          text_match: '<title>pve-orca - Proxmox Virtual Environment</title>'

  - id: "media"
    name: "Media & Streaming"
    icon: "film"
    services:
      - name: "Jellyfin"
        url: "https://jellyfin.home.brwyatt.net"
        description: "Movies, television, music, and streaming media library"
        icon: "film"
        requires_groups:
          - "jellyfin-users"
          - "jellyfin-admins"
        healthcheck:
          path: "/health"
          interval: 15
          text_match: 'Healthy'
      - name: "Seerr"
        url: "https://seerr.home.brwyatt.net"
        description: "Media request management and discovery"
        icon: "film"
        requires_groups:
          - "jellyfin-users"
          - "jellyfin-admins"
        healthcheck:
          path: "/health"
          interval: 15
          json_query: '$.*.status and $count(*[status="OK"]) = $count(*)'
      - name: "Radarr"
        url: "https://radarr.server.home.brwyatt.net"
        description: "Movie manager"
        icon: "film"
        network_classes:
          - "internal"
          - "vpn"
        requires_groups:
          - "arrsusers"
      - name: "Sonarr"
        url: "https://sonarr.server.home.brwyatt.net"
        description: "TV show manager"
        icon: "tv"
        network_classes:
          - "internal"
          - "vpn"
        requires_groups:
          - "arrsusers"
      - name: "Prowlarr"
        url: "https://prowlarr.server.home.brwyatt.net"
        description: "Tracker manager"
        icon: "network"
        network_classes:
          - "internal"
          - "vpn"
        requires_groups:
          - "arrsusers"
      - name: "Seedbox"
        url: "https://seedbox.server.home.brwyatt.net"
        description: "qBittorrent Web UI"
        icon: "download"
        network_classes:
          - "internal"
          - "vpn"
        requires_groups:
          - "seedboxusers"

  - id: "iot"
    name: "IoT and Home Automation"
    icon: "house"
    services:
      - name: "Home Assistant"
        url: "https://homeassistant.home.brwyatt.net/"
        description: "Home automation service"
        icon: "house"
        requires_groups:
          - "homeassistantusers"
          - "homeassistantadmins"
      - name: "Zigbee2MQTT"
        url: "https://zigbee2mqtt.iot.home.brwyatt.net/"
        description: "Zigbee device manager"
        icon: "radio"
        network_classes:
          - "internal"
          - "vpn"
        requires_groups:
          - "iot-admins"
      - name: "Z-Wave JS UI"
        url: "https://zwave-js-ui.iot.home.brwyatt.net/"
        description: "Z-Wave device manager"
        icon: "radio"
        network_classes:
          - "internal"
          - "vpn"
        requires_groups:
          - "iot-admins"

  - id: "home"
    name: "Household Management"
    icon: "house"
    services:
      - name: "HomeBox"
        url: "https://homebox.server.home.brwyatt.net"
        description: "Household inventory management"
        icon: "house"
        network_classes:
          - "internal"
          - "vpn"
        requires_groups:
          - "homeboxusers"
