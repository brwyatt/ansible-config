---
certbot_certs:
  - - "portal.home.brwyatt.net"
    - "home.brwyatt.net"

proxy_port: 8080
proxy_sso_enabled: true
proxy_sso_optional: true
proxy_healthcheck:
  path: /healthz
  checks:
    - type: port
      value: "{{ proxy_port }}"
    - type: service
      value: portal
proxy_public_paths:
  - "/static/"
  - "/theme.css"
  - "/readyz"
  - "/favicon.ico"

reverseproxy_nginx_after:
  - network-online.target
  - portal.service

reverseproxy_recursive_proxies: true
reverseproxy_trusted_proxies:
  # Inbound Proxy Hosts
  - "172.17.30.111"
  - "172.17.30.197"
  # Inbound Proxy VIP
  - "172.17.30.201"
  # Load Balancer Hosts
  - "172.17.30.120"
  - "172.17.30.124"
  # Load Balancer VIP
  - "172.17.30.212"

portal_ui_title: "BRNET-Home Portal"
portal_ui_footer_text: "Homelab Portal"
portal_network_trusted_proxies:
  - "127.0.0.1/32"
  - "::1/128"
  # Inbound Proxy Hosts
  - "172.17.30.197/32"
  - "172.17.30.111/32"
  # Inbound Proxy VIP
  - "172.17.30.201/32"
  # Load Balancer Hosts
  - "172.17.30.120/32"
  - "172.17.30.124/32"
  # Load Balancer VIP
  - "172.17.30.212/32"
portal_network_classes:
  external:
    name: "External"
    icon: "globe"
  internal:
    name: "Local"
    icon: "house"
  vpn:
    name: "VPN"
    icon: "shield"
  remote_site:
    name: "Remote Site"
    icon: "network"
portal_subnets:
  - cidr: "172.17.10.0/24"
    name: "User VLAN"
    network_class: "internal"
  - cidr: "172.16.10.0/24"
    name: "User VPN"
    network_class: "vpn"
  - cidr: "172.18.10.0/24"
    name: "ChickenCoop User"
    network_class: "remote_site"
portal_categories:
  - id: "auth"
    name: "Authentication Services"
    icon: "key"
    order: 10
  - id: "comms"
    name: "Communications Services"
    icon: "phone"
    order: 20
  - id: "infra"
    name: "Infrastructure Services"
    icon: "server"
    order: 30
  - id: "media"
    name: "Media & Streaming"
    icon: "film"
    order: 40
  - id: "iot"
    name: "IoT and Home Automation"
    icon: "house"
    order: 50
  - id: "home"
    name: "Houshold Management"
    icon: "house"
    order: 60
portal_services:
  # Auth
  - name: "Authelia"
    url: "https://auth.home.brwyatt.net/"
    description: "Single sign-on and identity provider portal"
    category: "auth"
    icon: "shield"
    order: 10
  - name: "FreeIPA"
    url: "https://ipa.home.brwyatt.net/"
    description: "LDAP account management"
    category: "auth"
    icon: "key"
    network_classes:
      - "internal"
      - "vpn"
    requires_groups:
      - "admins"
    order: 20
  # Communications
  - name: "The Lounge"
