---
certbot_certs:
  - ["{{ inventory_hostname }}"]

reverseproxy_sites:
  - server_names: "{{ certbot_certs[0] }}"
    destination: "{{ proxy_destination | default('http://127.0.0.1:' + (proxy_port | string)) }}"
    sso_enabled: "{{ proxy_sso_enabled | default(false) }}"
    sso_optional: "{{ proxy_sso_optional | default(false) }}"
    sso_cache_enabled: "{{ proxy_sso_cache_enabled | default(omit) }}"
    sso_cache_valid: "{{ proxy_sso_cache_valid | default(omit) }}"
    healthcheck: "{{ proxy_healthcheck | default(omit) }}"
    public_paths: "{{ proxy_public_paths | default(omit) }}"
    public_paths_regex: "{{ proxy_public_paths_regex | default(omit) }}"
    server_directives: "{{ proxy_server_directives | default(omit) }}"
