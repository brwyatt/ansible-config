---
- name: Conditionally update security-sensitive packages
  hosts: "{{ target_hosts | default('all') }}"
  serial: "{{ update_serial | default(1) }}"
  ignore_unreachable: true
  become: true
  gather_facts: true
  vars:
    security_package_patterns:
      - 'ca-certificates'
      - 'nodejs'
      - 'npm'
      - 'nginx.*'
      - 'httpd.*'
      - 'haproxy'
      - 'php.*'
      - 'openssh(-.*)?'
      - 'openssl'
      - '(lib)?cups.*'
      - '(lib)?curl.*'
      - 'git(-.*)?'
      - 'sudo.*'
      - '(lib)?gnutls.*'
      - '(lib)?expat.*'
      - '(lib)?xml2.*'
      - '(lib)?sqlite3.*'
      - 'rsync.*'
      - 'dnsmasq.*'
      - 'bind9.*'
      - 'xz-utils'
      - 'liblzma.*'
    security_package_pattern: "^({{ security_package_patterns | join('|') }})$"
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts.get('os_family') == 'Debian'
    - name: Update dnf cache
      ansible.builtin.dnf:
        update_cache: true
      when: ansible_facts.get('os_family') == 'RedHat'
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto
      when: ansible_facts.get('os_family') is not none
    - name: Identify installed target packages
      ansible.builtin.set_fact:
        installed_security_packages: >-
          {{
            ansible_facts.get('packages', {}).keys()
            | select('match', security_package_pattern)
            | list
          }}
      when: ansible_facts.get('os_family') is not none
    - name: Display identified packages to update
      ansible.builtin.debug:
        msg: "Found target packages on {{ inventory_hostname }}: {{ installed_security_packages }}"
      when: ansible_facts.get('os_family') is not none
    - name: Update identified packages on Debian and Ubuntu  # noqa: package-latest
      ansible.builtin.apt:
        name: "{{ installed_security_packages }}"
        state: latest
        only_upgrade: true
      when:
        - ansible_facts.get('os_family') == 'Debian'
        - installed_security_packages | default([]) | length > 0
    - name: Update identified packages on Fedora  # noqa: package-latest
      ansible.builtin.dnf:
        name: "{{ installed_security_packages }}"
        state: latest
      when:
        - ansible_facts.get('os_family') == 'RedHat'
        - installed_security_packages | default([]) | length > 0
